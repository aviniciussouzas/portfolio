<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traço de Vento</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.0.0-beta"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f1e8;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
let trails = [];
let numTrails = 15;
let smoothX = 0;
let smoothY = 0;
let prevSmoothX = 0;
let prevSmoothY = 0;

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  background("#f5f1e8");

  smoothX = mouseX - width / 2;
  smoothY = mouseY - height / 2;
  prevSmoothX = smoothX;
  prevSmoothY = smoothY;

  for (let i = 0; i < numTrails; i++) {
    trails.push({
      x: 0,
      y: 0,
      px: 0,
      py: 0,
      offsetX: random(-20, 20),
      offsetY: random(-20, 20),
      lag: random(0.04, 0.12),
      weight: random(0.6, 2.0),
      noiseSeed: random(1000)
    });
  }
}

function draw() {
  // fade suave para criar memória
  push();
  noStroke();
  fill(245, 241, 232, 18);
  rectMode(CENTER);
  rect(0, 0, width, height);
  pop();

  prevSmoothX = smoothX;
  prevSmoothY = smoothY;

  let targetX = mouseX - width / 2;
  let targetY = mouseY - height / 2;

  smoothX = lerp(smoothX, targetX, 0.18);
  smoothY = lerp(smoothY, targetY, 0.18);

  let dx = smoothX - prevSmoothX;
  let dy = smoothY - prevSmoothY;
  let speed = dist(smoothX, smoothY, prevSmoothX, prevSmoothY);

  for (let i = 0; i < trails.length; i++) {
    let t = trails[i];

    t.px = t.x;
    t.py = t.y;

    let n = frameCount * 0.01 + t.noiseSeed;
    let driftX = map(noise(n), 0, 1, -12, 12);
    let driftY = map(noise(n + 100), 0, 1, -12, 12);

    let tx = smoothX + t.offsetX + driftX + dx * random(1.5, 3.5);
    let ty = smoothY + t.offsetY + driftY + dy * random(1.5, 3.5);

    t.x = lerp(t.x, tx, t.lag);
    t.y = lerp(t.y, ty, t.lag);

    let alpha = map(speed, 0, 25, 25, 90, true);
    let w = t.weight + map(speed, 0, 25, 0, 1.8, true);

    brush.set("HB", color(35, 33, 30, alpha), w);
    brush.line(t.px, t.py, t.x, t.y);
  }
}

function keyPressed() {
  if (key === 'c' || key === 'C') {
    background("#f5f1e8");
  }

  if (key === 's' || key === 'S') {
    saveCanvas("traco-de-vento", "png");
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background("#f5f1e8");
}
</script>
</body>
</html>
