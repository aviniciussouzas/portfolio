<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        body {
            background: #1818ff;
            cursor: none;
            font-family: 'Inter', Helvetica, Arial, sans-serif;
        }

        /* ── SEÇÃO 1: HERO ── */
        #hero {
            width: 100vw;
            height: 100vh;
            background: #1818ff;
            position: relative;
            scroll-snap-align: start;
            overflow: hidden;
        }

        #p5-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* scanlines só no hero */
        #hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom,
                    transparent 0px, transparent 3px,
                    rgba(0, 0, 0, 0.06) 3px, rgba(0, 0, 0, 0.06) 4px);
        }

        #coords {
            position: absolute;
            top: 1.8rem;
            right: 2rem;
            z-index: 20;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.2);
            text-align: right;
            pointer-events: none;
            line-height: 1.8;
        }

        #px-label {
            position: absolute;
            top: 1.8rem;
            left: 2rem;
            z-index: 20;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            line-height: 1.8;
        }

        /* scroll hint */
        #scroll-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            animation: blink 2.4s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.25;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* ── SEÇÃO 2: MANIFESTO ── */
        #manifesto {
            width: 100vw;
            min-height: 100vh;
            background: #1818ff;
            position: relative;
            scroll-snap-align: start;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        #halftone-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #manifesto-card {
            position: relative;
            z-index: 10;
            background: #ffffff;
            padding: 3rem 3rem 3.5rem;
            margin-left: 8vw;
            max-width: 480px;
            width: calc(100% - 10vw);
        }

        #manifesto-card p {
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            font-size: clamp(1rem, 2.2vw, 1.3rem);
            font-weight: 500;
            line-height: 1.55;
            color: #1818ff;
            letter-spacing: -0.01em;
        }

        #manifesto-card .label {
            display: block;
            font-family: 'Courier New', monospace;
            font-size: 0.5rem;
            letter-spacing: 0.22em;
            color: rgba(24, 24, 255, 0.35);
            text-transform: uppercase;
            margin-bottom: 1.4rem;
        }
    </style>
</head>

<body>

    <!-- ── SEÇÃO 1: HERO ── -->
    <section id="hero">
        <div id="p5-container"></div>
        <div id="coords">X:000 Y:000<br>PX:00</div>
        <div id="px-label">PIXEL_DENSITY<br><span id="bar"></span></div>
        <div id="scroll-hint">scroll ↓</div>
    </section>

    <!-- ── SEÇÃO 2: MANIFESTO ── -->
    <section id="manifesto">
        <canvas id="halftone-canvas"></canvas>
        <div id="manifesto-card">
            <span class="label">manifesto</span>
            <p>Não vejo design como uma camada final. Vejo como um sistema em movimento onde forma, comportamento e
                intenção precisam estar alinhados.</p>
        </div>
    </section>

    <script>
        // ═══════════════════════════════════════════════
        // SEÇÃO 1 — HERO: tipografia scramble + cursor
        // ═══════════════════════════════════════════════
        const FINAL = "talvez a vantagem humana passe a ser justamente criar ideias um pouco estranhas, imperfeitas ou culturalmente específicas demais para um modelo prever.";
        const CHARS = "!@#$%^&*<>?/\\|[]{}0123456789ABCDEFabcdef_-=+~`";

        const coordsEl = document.getElementById('coords');
        const barEl = document.getElementById('bar');

        window._globalPx = 1;

        const sketch = (p) => {
            let spd = 0, px = 1, tpx = 1, pmx = 0, pmy = 0;
            let revealed = 0, lastReveal = 0;
            let states = FINAL.split('').map(() => ({ rev: false, sc: 0, ch: ' ' }));
            let textLines = [], fontSize, lineH, textGfx;

            function rnd() { return CHARS[Math.floor(Math.random() * CHARS.length)]; }

            function buildText() {
                const cw = p.width, ch = p.height;
                fontSize = Math.round(cw * 0.048);
                lineH = Math.round(fontSize * 1.42);
                const pad = Math.round(cw * 0.06);
                const maxW = cw - pad * 2;

                p.textFont('Courier New');
                p.textSize(fontSize);

                const words = FINAL.split(' ');
                textLines = [];
                let cur = '';
                for (const w of words) {
                    const test = cur ? cur + ' ' + w : w;
                    if (p.textWidth(test) > maxW && cur) { textLines.push(cur); cur = w; }
                    else cur = test;
                }
                if (cur) textLines.push(cur);

                const totalH = textLines.length * lineH + pad * 2;
                if (textGfx) textGfx.remove();
                textGfx = p.createGraphics(cw, totalH);
                textGfx.pixelDensity(1);
                textGfx.noSmooth();
            }

            function renderText() {
                if (!textGfx) return;
                const cw = p.width;
                const pad = Math.round(cw * 0.06);

                textGfx.clear();
                textGfx.noStroke();
                textGfx.textFont('Courier New');
                textGfx.textSize(fontSize);
                textGfx.textStyle(p.BOLD);

                let charIdx = 0;
                for (let li = 0; li < textLines.length; li++) {
                    const line = textLines[li];
                    let xc = pad;
                    const y = pad + li * lineH;
                    for (let ci = 0; ci < line.length; ci++) {
                        const s = states[charIdx++];
                        if (!s || !s.rev) { xc += textGfx.textWidth(line[ci]); continue; }

                        let col;
                        if (s.sc > 0) {
                            // scramble: vai do azul para branco
                            const t = 1 - s.sc / 12;
                            col = [
                                Math.round(24 + (255 - 24) * t),
                                Math.round(24 + (255 - 24) * t),
                                255
                            ];
                            // sombra
                            textGfx.fill(0, 0, 80, 100);
                            textGfx.text(s.ch, xc + 2, y + 2);
                            textGfx.fill(col[0], col[1], col[2]);
                            textGfx.text(s.ch, xc, y);
                        } else {
                            textGfx.fill(255);
                            textGfx.text(line[ci], xc, y);
                        }
                        xc += textGfx.textWidth(line[ci]);
                    }
                }
            }

            function drawTextPx(ps) {
                if (!textGfx) return;
                const ch = p.height;
                const gH = textGfx.height;
                const gW = textGfx.width;
                const yOff = Math.round(ch * 0.5 - gH * 0.5); // centralizado verticalmente

                if (ps <= 2) { p.image(textGfx, 0, yOff); return; }

                textGfx.loadPixels();
                const d = textGfx.pixels;
                p.noStroke();

                const cols = Math.ceil(gW / ps);
                const rows = Math.ceil(gH / ps);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const sx = Math.min(Math.floor(c * ps + ps * 0.5), gW - 1);
                        const sy = Math.min(Math.floor(r * ps + ps * 0.5), gH - 1);
                        const i = (sy * gW + sx) * 4;
                        if (d[i + 3] < 10) continue;
                        p.fill(d[i], d[i + 1], d[i + 2], d[i + 3]);
                        p.rect(c * ps, yOff + r * ps, ps, ps);
                    }
                }
            }

            function updateScramble(speed) {
                const now = Date.now();
                const rate = Math.floor(speed * 0.18);
                if (rate > 0 && now - lastReveal > 25) {
                    const todo = Math.min(rate, FINAL.length - revealed);
                    for (let i = 0; i < todo; i++) {
                        const idx = revealed + i;
                        if (idx < FINAL.length) {
                            states[idx].rev = true;
                            states[idx].sc = 8 + Math.floor(Math.random() * 8);
                            states[idx].ch = rnd();
                        }
                    }
                    revealed += todo;
                    lastReveal = now;
                }
                for (const s of states) {
                    if (s.rev && s.sc > 0) { s.sc--; s.ch = rnd(); }
                }
            }

            p.setup = () => {
                const c = p.createCanvas(
                    document.getElementById('hero').offsetWidth,
                    document.getElementById('hero').offsetHeight
                );
                c.parent('p5-container');
                p.noSmooth();
                p.pixelDensity(1);
                buildText();
            };

            p.draw = () => {
                const dx = p.mouseX - pmx, dy = p.mouseY - pmy;
                spd = Math.sqrt(dx * dx + dy * dy);
                pmx = p.mouseX; pmy = p.mouseY;

                tpx = 1 + Math.min(spd * 1.4, 48);
                px += (tpx - px) * 0.1;
                px = Math.max(1, px);
                const ps = Math.round(px);
                window._globalPx = px;

                p.background(24, 24, 255);
                updateScramble(spd);
                renderText();
                drawTextPx(ps);

                // cursor — quadrado sutil snap-ao-grid
                const cs = Math.max(ps, 3);
                const gx = Math.floor(p.mouseX / cs) * cs;
                const gy = Math.floor(p.mouseY / cs) * cs;
                p.noStroke();
                p.fill(255, 255, 255, 90);
                p.rect(gx, gy, cs, cs);

                // HUD
                const blen = Math.min(Math.round(spd * 0.28), 14);
                coordsEl.innerHTML = `X:${String(Math.round(p.mouseX)).padStart(3, '0')} Y:${String(Math.round(p.mouseY)).padStart(3, '0')}<br>PX:${String(ps).padStart(2, '0')}`;
                barEl.textContent = '\u2588'.repeat(blen);
                barEl.style.opacity = Math.min(0.9, spd * 0.04).toFixed(2);
            };

            p.windowResized = () => {
                p.resizeCanvas(
                    document.getElementById('hero').offsetWidth,
                    document.getElementById('hero').offsetHeight
                );
                buildText();
            };
        };

        new p5(sketch);


        // ═══════════════════════════════════════════════
        // SEÇÃO 2 — HALFTONE: processa imagem uma vez

            const CELL = 11;   // tamanho da célula em px
            const canvas = document.getElementById('halftone-canvas');
            const ctx = canvas.getContext('2d');

            function buildHalftone(img) {
                const sec = document.getElementById('manifesto');
                const W = sec.offsetWidth;
                const H = sec.offsetHeight || window.innerHeight;

                canvas.width = W;
                canvas.height = H;

                // fundo azul
                ctx.fillStyle = '#1818ff';
                ctx.fillRect(0, 0, W, H);

                // cover-fit da imagem num canvas auxiliar
                const tmp = document.createElement('canvas');
                tmp.width = W;
                tmp.height = H;
                const tctx = tmp.getContext('2d');
                const sc = Math.max(W / img.width, H / img.height);
                const sw = img.width * sc;
                const sh = img.height * sc;
                const ox = (W - sw) / 2;
                const oy = (H - sh) / 2;
                tctx.drawImage(img, ox, oy, sw, sh);
                const data = tctx.getImageData(0, 0, W, H).data;

                // halftone: círculos azul escuro/claro por luminância
                const cols = Math.ceil(W / CELL);
                const rows = Math.ceil(H / CELL);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const cx = c * CELL + CELL * 0.5;
                        const cy = r * CELL + CELL * 0.5;
                        const px = Math.min(Math.floor(cx), W - 1);
                        const py = Math.min(Math.floor(cy), H - 1);
                        const i = (py * W + px) * 4;

                        // luminância 0–1
                        const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;

                        // raio: áreas escuras → ponto grande, claras → ponto pequeno
                        const maxR = CELL * 0.52;
                        const minR = CELL * 0.04;
                        const rad = minR + (1 - lum) * (maxR - minR);

                        if (rad < 0.8) continue;

                        // cor: varia entre azul profundo e azul Klein claro
                        // escuro = #0a0a99, claro = #4444ff
                        const t = lum; // 0 escuro, 1 claro
                        const rr = Math.round(10 + t * (68 - 10));
                        const gg = Math.round(10 + t * (68 - 10));
                        const bb = Math.round(153 + t * (255 - 153));

                        ctx.beginPath();
                        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
                        ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
                        ctx.fill();
                    }
                }
            }

            // carrega imagem e constrói halftone
            const img = new Image();
            img.onload = () => {
                buildHalftone(img);
                window.addEventListener('resize', () => buildHalftone(img));
            };
            img.src = IMG_SRC;
        })();
    </script>
